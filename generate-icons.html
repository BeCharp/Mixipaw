<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Mixipaw — Générer les icônes</title>
<style>
  body{font-family:system-ui,sans-serif;background:#FAF7F2;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;margin:0}
  .box{background:#fff;border-radius:20px;padding:32px;max-width:440px;width:100%;border:.5px solid rgba(0,0,0,.08);text-align:center}
  h1{font-size:20px;color:#2D3128;margin:12px 0 8px}h1 span{color:#C4724A}
  p{font-size:13px;color:#6B7066;line-height:1.6;margin-bottom:20px}
  code{background:#EBF3EE;border-radius:4px;padding:1px 5px;font-size:12px}
  .btn{background:#7A9E87;color:#fff;border:none;border-radius:12px;padding:13px 28px;font-size:15px;cursor:pointer;width:100%;font-family:inherit}
  .btn:hover{background:#6b8e78}
  .status{font-size:13px;color:#6B7066;margin-top:14px;min-height:20px}
  .prev{display:flex;justify-content:center;gap:16px;margin:16px 0;flex-wrap:wrap}
  .prev-item{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11px;color:#6B7066}
  .links{display:flex;flex-direction:column;gap:7px;margin-top:8px}
  .dl{display:flex;justify-content:space-between;align-items:center;background:#EBF3EE;color:#3E6449;border-radius:9px;padding:9px 13px;font-size:13px;text-decoration:none;cursor:pointer}
  .dl:hover{background:#C8DDD0}
  .note{background:#EBF3EE;border-radius:10px;padding:10px 14px;font-size:11px;color:#3E6449;margin-top:12px;line-height:1.5;display:none;text-align:left}
  canvas{display:none}
</style>
</head>
<body>
<div class="box">
  <div style="font-size:56px">🐾</div>
  <h1>Icônes <span>Mixipaw</span></h1>
  <p>Générez et téléchargez les icônes PNG, puis placez-les dans le dossier <code>icons/</code> de votre projet.</p>
  <button class="btn" onclick="generate()">Générer les icônes</button>
  <div class="status" id="status"></div>
  <div class="prev" id="prev"></div>
  <div class="links" id="links"></div>
  <div class="note" id="note">✅ Téléchargez chaque fichier et copiez-les dans <code>icons/</code> à la racine de votre repo GitHub.</div>
</div>
<canvas id="c"></canvas>
<script>
const SIZES=[72,96,128,144,152,192,384,512];
function drawIcon(sz){
  const c=document.getElementById('c');c.width=c.height=sz;
  const ctx=c.getContext('2d');const r=sz*.2;
  ctx.beginPath();ctx.moveTo(r,0);ctx.arcTo(sz,0,sz,sz,r);ctx.arcTo(sz,sz,0,sz,r);ctx.arcTo(0,sz,0,0,r);ctx.arcTo(0,0,sz,0,r);ctx.closePath();
  ctx.fillStyle='#7A9E87';ctx.fill();
  ctx.font=`${Math.round(sz*.52)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🐾',sz/2,sz/2+sz*.03);
  return c.toDataURL('image/png');
}
function generate(){
  const status=document.getElementById('status'),links=document.getElementById('links'),prev=document.getElementById('prev'),note=document.getElementById('note');
  status.textContent='⏳ Génération…';links.innerHTML='';prev.innerHTML='';note.style.display='none';
  setTimeout(()=>{
    SIZES.forEach(sz=>{
      const url=drawIcon(sz);
      if([96,192,512].includes(sz)){
        const ps=Math.min(sz,64);const img=new Image();img.src=url;img.style.cssText=`width:${ps}px;height:${ps}px;border-radius:${ps*.2}px;display:block`;
        const w=document.createElement('div');w.className='prev-item';w.appendChild(img);w.appendChild(Object.assign(document.createElement('span'),{textContent:`${sz}px`}));prev.appendChild(w);
      }
      const a=document.createElement('a');a.href=url;a.download=`icon-${sz}.png`;a.className='dl';
      a.innerHTML=`<span>icon-${sz}.png</span><span>⬇ Télécharger</span>`;links.appendChild(a);
    });
    status.textContent=`✅ ${SIZES.length} icônes générées`;note.style.display='block';
  },80);
}
</script>
</body>
</html>
